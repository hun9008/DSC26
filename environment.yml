name: dsc_env
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  - numpy
  - scipy
  - pandas
  - scikit-learn
  - matplotlib
  - numexpr
  - joblib
  - tqdm
  - psutil
  - jinja2
  - sqlalchemy
  - graphviz
  - pip
  - pytz

  - pytorch
  - torchvision
  - torchaudio

  - ipython
  - ipykernel
  - jupyter_client
  - jupyter_core

  - pip:
      - lightgbm==4.6.0
      - catboost==1.2.8
      - xgboost==3.1.1
      - optuna==4.6.0
      - plotly==6.5.0
      - narwhals==2.12.0
      - colorlog==6.10.1
      - Mako==1.3.10